services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: college_cms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes: [pgdata:/var/lib/postgresql/data]
  web:
    build: .
    env_file: .env
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    ports: ["8000:8000"]
    volumes: [media:/app/media]
    depends_on: [db]
volumes:
  pgdata:
  media:
