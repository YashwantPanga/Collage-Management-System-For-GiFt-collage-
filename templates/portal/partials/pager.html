{% if page.has_other_pages %}
<nav class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2" aria-label="Pagination">
    <span class="small text-muted">Page {{ page.number }} of {{ page.paginator.num_pages }} · {{ page.paginator.count }} records</span>
    <div class="d-flex gap-1">
        {% if page.has_previous %}<a class="btn-ghost btn-sm-p" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.previous_page_number }}"><i class="fa-solid fa-chevron-left"></i></a>{% endif %}
        {% if page.has_next %}<a class="btn-ghost btn-sm-p" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.next_page_number }}"><i class="fa-solid fa-chevron-right"></i></a>{% endif %}
    </div>
</nav>
{% endif %}
