<div class="faq-wrap1">
    <div class="accordion" id="faqAccordion">
        {% for f in faqs %}
        <div class="accordion-card wow fadeInUp" data-wow-delay=".{{ forloop.counter }}s">
            <div class="accordion-header" id="collapse-item-{{ f.pk }}">
                <button class="accordion-button {% if not forloop.first %}collapsed{% endif %}" type="button" data-bs-toggle="collapse" data-bs-target="#collapse-{{ f.pk }}" aria-expanded="{% if forloop.first %}true{% else %}false{% endif %}" aria-controls="collapse-{{ f.pk }}">{{ forloop.counter|stringformat:"02d" }}. {{ f.question }}</button>
            </div>
            <div id="collapse-{{ f.pk }}" class="accordion-collapse collapse {% if forloop.first %}show{% endif %}" aria-labelledby="collapse-item-{{ f.pk }}" data-bs-parent="#faqAccordion">
                <div class="accordion-body"><p class="faq-text">{{ f.answer|linebreaksbr }}</p></div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
