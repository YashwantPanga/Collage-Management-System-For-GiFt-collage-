{% load static %}<div class="breadcumb-wrapper position-relative " data-bg-src="{% static 'assets/img/shape/breadcrumb-shep.png' %}">
    <div class="breadcumb-banner">
        <img src="{% static banner|default:'brand/campus1.jpg' %}" alt="{{ title }}">
    </div>
    <div class="breadcumb-shape">
        <img src="{% static 'assets/img/shape/triangle-light.png' %}" alt="shape" class="jump">
    </div>
    <div class="container th-container4">
        <div class="row">
            <div class="col-xxl-5 col-xl-6 col-lg-7">
                <div class="breadcumb-content">
                    <h1 class="breadcumb-title">{{ title }}</h1>
                    <ul class="breadcumb-menu">
                        <li><a href="{% url 'website:home' %}">Home</a></li>
                        {% if parent_url %}<li><a href="{{ parent_url }}">{{ parent }}</a></li>{% endif %}
                        <li>{{ title }}</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
