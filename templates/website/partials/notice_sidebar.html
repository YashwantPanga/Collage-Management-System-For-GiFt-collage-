{% load site_tags %}<aside class="sidebar-area">
    <div class="widget widget_search">
        <form class="search-form" action="{% url 'website:search' %}" method="get">
            <input type="text" name="q" placeholder="Search notices...">
            <button type="submit" aria-label="Search"><i class="far fa-search"></i></button>
        </form>
    </div>
    <div class="widget widget_categories">
        <h3 class="widget_title">Categories</h3>
        <ul>
            <li><a href="{% url 'website:notices' %}">All</a></li>
            {% for code, label in categories %}<li><a href="{% url 'website:notices' %}?category={{ code }}">{{ label }}</a></li>{% endfor %}
        </ul>
    </div>
    <div class="widget">
        <h3 class="widget_title">Recent Posts</h3>
        <div class="recent-post-wrap">
            {% for r in recent %}
            <div class="recent-post">
                <div class="media-img"><a href="{{ r.get_absolute_url }}"><img src="{{ r.image|asset }}" alt="{{ r.title }}" style="width:80px;height:80px;object-fit:cover;"></a></div>
                <div class="media-body">
                    <h4 class="post-title"><a class="text-inherit" href="{{ r.get_absolute_url }}">{{ r.title }}</a></h4>
                    <div class="recent-post-meta"><a href="{{ r.get_absolute_url }}"><i class="far fa-calendar"></i>{{ r.published_on|date:"d/m/Y" }}</a></div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</aside>
